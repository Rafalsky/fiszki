name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Stage site files
        run: |
          mkdir -p _site
          cp -r index.html css js data grammar _site/
          # _template is a dev-only scaffold for adding new grammar topic
          # pages, not a real page - nothing links to it, so it never needs
          # to be served.
          rm -rf _site/grammar/_template

      - name: Version local asset URLs (cache-busting)
        run: |
          # ES modules and the browser's HTTP cache key each imported file by
          # its own exact URL, independent of the page/entry script that
          # imports it. Without this, a fast reload shortly after a deploy
          # can end up running a stale cached module (e.g. old app.js)
          # alongside a fresh index.html/CSS, producing confusing runtime
          # errors from DOM elements that no longer match. Appending the
          # commit SHA as a query string to every local module/style/data
          # reference forces a fresh fetch on every deploy that actually
          # changes something, without touching the source repo itself.
          SHA="${GITHUB_SHA:0:8}"
          echo "Cache-busting version: $SHA"

          # Every page (index.html plus every grammar/<topic>/index.html) -
          # rewrite its local <link href="...css"> and <script src="...js">
          # regardless of how many "../" levels deep the page lives.
          find _site -name '*.html' -print0 \
            | xargs -0 perl -pi -e "s{(href=\")([^\"]+\.css)(\")}{\${1}\${2}?v=$SHA\${3}}g; s{(src=\")([^\"]+\.js)(\")}{\${1}\${2}?v=$SHA\${3}}g"

          find _site/js -name '*.js' -print0 \
            | xargs -0 perl -pi -e "s{from \"(\.\.?/[^\"]+\.js)\"}{from \"\${1}?v=$SHA\"}g"
          find _site/js -name '*.js' -print0 \
            | xargs -0 perl -pi -e "s{new URL\(\"(\.\.?/[^\"]+\.json)\", import\.meta\.url\)}{new URL(\"\${1}?v=$SHA\", import.meta.url)}g"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
